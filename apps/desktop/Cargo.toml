[package]
name = "voxproof-desktop"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "=0.35.0", features = ["accesskit", "default_fonts", "wgpu"] }
egui = "=0.35.0"
font-kit = "=0.14.3"
rfd = "=0.15.4"
vox-proof = { path = "../.." }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "AVAssetTrack",
    "AVMediaFormat",
    "AVPlayer",
    "AVPlayerItem",
    "AVPlayerItemOutput",
    "AVPlayerItemTrack",
    "objc2-core-media",
    "objc2-core-video",
] }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
    "CMTime",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
    "objc2",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "CFString",
] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "voxproof_desktop"
path = "src/lib.rs"

[[bin]]
name = "voxproof-desktop"
path = "src/main.rs"
