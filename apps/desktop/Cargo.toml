[package]
name = "voxproof-desktop"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
directories = "6"
eframe = { version = "=0.35.0", features = ["accesskit", "default_fonts", "wgpu"] }
egui = "=0.35.0"
font-kit = "=0.14.3"
rfd = "=0.15.4"
vox-proof = { path = "../.." }

[dev-dependencies]
tempfile = "3"

[lib]
name = "voxproof_desktop"
path = "src/lib.rs"

[[bin]]
name = "voxproof-desktop"
path = "src/main.rs"
